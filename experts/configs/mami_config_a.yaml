
# mami_config_a.yaml - Configurazione per MemeCLIP (Task A: Binary)

# -----------------
# 1. MODELLO E BACKBONE CLIP
# -----------------

model:
  name: CLIP
  # Modello CLIP: ViT-B/32 (Vision Transformer Base, patch 32x32)
  clip_model: ViT-L/14 

# -----------------
# 2. DATI E PERCORSI (CRUCIALE: MODIFICARE I PERCORSI)
# -----------------
data:
  # AGGIUNTO: Chiave necessaria per lo script 'datasets.py' di MemeCLIP
  dataset_name: MAMI
  
  # PERCORSO ASSOLUTO ALLA CARTELLA CONTENENTE LE IMMAGINI JPG/PNG ORIGINALI
  # DEVI VERIFICARE questo percorso esatto nel tuo /beegfs-scratch/
  root_dir: /beegfs-scratch/rpisanu/MAMI/MAMI_DATASET/ALL_MAMI_IMAGES/ 

  # PERCORSI CORRETTI: Puntano ai file CSV generati dal tuo script di conversione
  train_file: /beegfs-scratch/rpisanu/MAMI/data/MAMI/train.csv
  val_file: /beegfs-scratch/rpisanu/MAMI/data/MAMI/dev.csv
  test_file: /beegfs-scratch/rpisanu/MAMI/data/MAMI/test.csv

  # Numero di classi per la Task A (Misogynistic / Not Misogynistic)
  num_classes: 2

  # Parametri del DataLoader
  batch_size: 32   # Valore da ottimizzare in base alla VRAM disponibile
  num_workers: 2   # Aumentato a 8 (hai richiesto 8 CPU) per un caricamento dati più veloce

# -----------------
# 3. ADDESTRAMENTO E LOGGING
# -----------------
training:
  optimizer: AdamW
  learning_rate: 1.0e-5

  # Parametri di addestramento
  num_epochs: 15
  gpus: [0]        # Usa la prima GPU allocata dal job Slurm

  # Directory per salvare i log e il miglior modello (percorsi relativi alla cartella 'code')
  log_dir: ../logs/MAMI_TaskA_MemeCLIP
  checkpoint_dir: ../checkpoints/MAMI_TaskA_MemeCLIP

# =========================================================================
# 4. PARAMETRI DI ARCHITETTURA (per risolvere l'errore di dimensione)
# =========================================================================

# Dimensione in output dal backbone CLIP (ViT-B/32) -> 512
unmapped_dim: 1024

# Dimensione desiderata dell'embedding mappato (solitamente 768 o 1024)
map_dim: 1024

# Altri parametri di architettura (necessari per MemeCLIP.py)
num_mapping_layers: 1
num_pre_output_layers: 1
drop_probs: [0.1, 0.4, 0.2]
ratio: 0.2
scale: 30

