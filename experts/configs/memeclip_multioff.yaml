
unmapped_dim: 1024

data:
  dataset_name: MultiOFF
  root_dir: /home/rpisanu/MultiOFF/MultiOFF_Dataset/Labelled Images/  

  train_file: /home/rpisanu/MultiOFF/MultiOFF_Dataset/Split Dataset/Training_meme_dataset.csv
  val_file: /home/rpisanu/MultiOFF/MultiOFF_Dataset/Split Dataset/Validation_meme_dataset.csv
  test_file: /home/rpisanu/MultiOFF/MultiOFF_Dataset/Split Dataset/Testing_meme_dataset.csv
  
  label: label
  num_classes: 2
  batch_size: 32
  num_workers: 4
  image_size: 224

model:
  name: MemeCLIP
  clip_variant: ViT-L/14
  
  unmapped_dim: 1024
  map_dim: 1024
  num_mapping_layers: 1
  num_pre_output_layers: 3
  drop_probs: [0.1, 0.4, 0.2]
  ratio: 0.2
  
  class_names: ["non_offensive meme", "offensive meme"]

training:
  optimizer: AdamW
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  max_epochs: 15
  device: cuda
  checkpoint_dir: ./checkpoints
  log_dir: ./logs
